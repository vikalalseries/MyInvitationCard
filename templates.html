<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Templates</title>

  <link rel="stylesheet" href="css/templates.css">
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo">
      MyInvitationCard
    </div>

    <div class="nav-links">
      <a href="#">Templates</a>
      <a href="#">Pricing</a>
      <a href="#">Login</a>
    </div>

  </nav>

  <!-- HEADER -->

  <section class="header">

    <h1>
      Invitation Card Templates
    </h1>

    <p>
      Choose beautiful Indian invitation templates
    </p>

  </section>

  <!-- FILTERS -->

  <section class="filters">

    <button class="active">
      All
    </button>

    <button>
      Wedding
    </button>

    <button>
      Nikah
    </button>

    <button>
      Birthday
    </button>

  </section>

  <!-- TEMPLATE GRID -->

  <section class="template-grid">

    <!-- CARD 1 -->

    <div class="template-card">

      <div class="card-preview">
        <img src="assets/templates/wedding1.jpg" alt="">
      </div>

      <div class="card-content">

        <h3>Royal Wedding</h3>

        <p>Elegant Indian Wedding Template</p>

        <a href="builder.html?template=wedding">
          <button>
            Use Template
          </button>
        </a>

      </div>

    </div>

    <!-- CARD 2 -->

    <div class="template-card">

      <div class="card-preview">
        <img src="assets/templates/nikah1.jpg" alt="">
      </div>

      <div class="card-content">

        <h3>Classic Nikah</h3>

        <p>Minimal Muslim Invitation</p>

        <a href="builder.html?template=nikah">
          <button>
            Use Template
          </button>
        </a>

      </div>

    </div>

    <!-- CARD 3 -->

    <div class="template-card">

      <div class="card-preview">
        <img src="assets/templates/birthday1.png" alt="">
      </div>

      <div class="card-content">

        <h3>Birthday Celebration</h3>

        <p>Modern Birthday Invitation</p>

        <a href="builder.html?template=birthday">
          <button>
            Use Template
          </button>
        </a>

      </div>

    </div>    


  </section>
  <script src="js/templates.js"></script>
</body>
</html>
