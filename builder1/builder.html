<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Builder — MyInvitationCard</title>
  <meta name="description" content="Edit your Hindu wedding invitation card with live preview.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
  /* ══════════════════════════════════════ DESIGN TOKENS */
  :root {
    --w:   #ffffff;
    --g50:  #fbfbf9;
    --g100: #f4f3f0;
    --g150: #ebeae6;
    --g200: #e2e0db;
    --g300: #c5c2bb;
    --g400: #98948d;
    --g500: #68655e;
    --g700: #3a3834;
    --g900: #1a1916;

    --rose:      #f43f5e;
    --rose-50:   #fff1f3;
    --rose-100:  #ffe0e6;
    --rose-dark: #e11d48;

    --gold:    #c9784c;
    --success: #10b981;
    --success-light: #ecfdf5;

    --topbar-h: 56px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --r-card: 14px;
    --r-md: 10px;
    --r-sm: 6px;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
    --card-shadow-hover: 0 8px 24px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05);
    --t: 160ms cubic-bezier(0.4,0,0.2,1);
  }

  /* ══════════════════════════════════════ RESET */
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html { font-size:16px; }
  body { font-family:var(--font); background:var(--g100); color:var(--g900); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font-family:var(--font); cursor:pointer; border:none; background:none; outline:none; }
  input,textarea,select { font-family:var(--font); }
  a { text-decoration:none; color:inherit; }
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:var(--g200); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--g300); }

  /* ══════════════════════════════════════ APP SHELL */
  .app  { display:flex; flex-direction:column; height:100vh; }
  .body { display:flex; flex:1; overflow:hidden; position:relative; }

  /* ══════════════════════════════════════ TOPBAR */
  .topbar {
    height:var(--topbar-h);
    background:var(--w);
    display:flex; align-items:center; padding:0 12px;
    border-bottom:1px solid var(--g200);
    z-index:200; flex-shrink:0;
    gap:0;
  }

  .tb-home {
    width:36px; height:36px; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center;
    color:var(--g400); flex-shrink:0; transition:all var(--t);
    margin-right:2px;
  }
  .tb-home:hover { background:var(--g100); color:var(--g700); }

  .tb-logo {
    display:flex; align-items:center; gap:7px;
    padding:5px 10px; border-radius:var(--r-md);
    transition:background var(--t); flex-shrink:0;
  }
  .tb-logo:hover { background:var(--g100); }
  .tb-logo-svg { width:22px; height:22px; flex-shrink:0; }
  .tb-logo-name { font-size:0.86rem; font-weight:750; color:var(--g900); letter-spacing:-0.4px; white-space:nowrap; }

  .tb-sep { width:1px; height:20px; background:var(--g200); margin:0 6px; flex-shrink:0; }

  /* Nav tabs */
  .tb-tabs { display:flex; align-items:center; gap:1px; }
  .tab-btn {
    display:inline-flex; align-items:center; gap:5px;
    padding:7px 13px; border-radius:var(--r-md);
    font-size:0.82rem; font-weight:500;
    color:var(--g500); white-space:nowrap;
    transition:all var(--t); cursor:pointer; position:relative;
  }
  .tab-btn:hover { color:var(--g900); background:var(--g100); }
  .tab-btn .tab-ico { display:flex; align-items:center; opacity:0.7; }
  .tab-btn.active { color:var(--rose); font-weight:600; background:var(--rose-50); }
  .tab-btn.active .tab-ico { opacity:1; }
  .tab-btn.active::after {
    content:''; position:absolute; bottom:-11px; left:50%;
    transform:translateX(-50%); width:55%; height:2px;
    background:var(--rose); border-radius:2px 2px 0 0;
  }
  .tab-btn.ai-tab { color:#7c3aed; }
  .tab-btn.ai-tab:hover { background:#faf5ff; }
  .tab-btn.ai-tab.active { color:#7c3aed; background:#faf5ff; }
  .tab-btn.ai-tab.active::after { background:#7c3aed; }

  .tb-right { display:flex; align-items:center; gap:7px; margin-left:auto; flex-shrink:0; }

  /* Properties button */
  .prop-btn {
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border:1.5px solid var(--g200);
    border-radius:var(--r-md); font-size:0.79rem; font-weight:600;
    color:var(--g700); background:var(--w); transition:all var(--t);
  }
  .prop-btn:hover { border-color:var(--g300); background:var(--g100); }

  /* Stats icon button */
  .stats-btn {
    width:34px; height:34px; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--g200); color:var(--g500);
    transition:all var(--t);
  }
  .stats-btn:hover { border-color:var(--g300); color:var(--g900); background:var(--g100); }

  .tb-right { display:flex; align-items:center; gap:7px; margin-left:auto; flex-shrink:0; }

  .save-status { display:flex; align-items:center; gap:5px; font-size:0.72rem; color:var(--g400); font-weight:500; }
  .save-dot { width:5px; height:5px; border-radius:50%; background:var(--success); transition:background var(--t); }
  .save-status.saving .save-dot { background:var(--rose); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .doc-title-wrap { display:flex; align-items:center; gap:6px; }
  .doc-title-input {
    border:1.5px solid transparent; background:transparent;
    padding:5px 10px; border-radius:var(--r-md);
    font-size:0.8rem; font-weight:600; color:var(--g700);
    max-width:180px; outline:none; transition:all var(--t); cursor:pointer;
  }
  .doc-title-input:hover { background:var(--g100); border-color:var(--g200); }
  .doc-title-input:focus { background:var(--w); border-color:var(--rose); box-shadow:0 0 0 3px var(--rose-100); cursor:text; }

  .dl-wrap { position:relative; }
  .dl-btn {
    display:flex; align-items:center; gap:7px;
    padding:7px 14px; background:#0f172a; color:var(--w);
    border-radius:var(--r-md); font-size:0.8rem; font-weight:650;
    transition:all var(--t);
  }
  .dl-btn:hover { background:#1e293b; box-shadow:0 4px 12px rgba(15,23,42,0.18); }
  .dl-menu {
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--w); border:1px solid var(--g200);
    border-radius:12px; box-shadow:0 12px 36px rgba(0,0,0,0.12);
    min-width:190px; z-index:999; padding:5px;
    opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:all var(--t);
  }
  .dl-wrap.open .dl-menu { opacity:1; visibility:visible; transform:translateY(0); }
  .dl-item {
    display:flex; align-items:center; gap:10px; width:100%;
    padding:9px 12px; border-radius:var(--r-md);
    font-size:0.8rem; font-weight:550; color:var(--g700);
    cursor:pointer; transition:background var(--t); text-align:left;
  }
  .dl-item:hover { background:var(--g100); color:var(--g900); }
  .dl-sep { height:1px; background:var(--g150); margin:4px 0; }
  .dl-chev { transition:transform var(--t); }
  .dl-wrap.open .dl-chev { transform:rotate(180deg); }

  /* ══════════════════════════════════════ LEFT COLUMN */
  .left-col {
    width:40%; flex-shrink:0;
    background:var(--g50);
    border-right:1px solid var(--g200);
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  .left-scroll { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 40px; }

  /* ══════════════════════════════════════ PERSONAL CARD BANNER */
  .pc-banner {
    background:var(--w); border-radius:var(--r-card);
    box-shadow:var(--card-shadow); margin:14px 16px 12px;
    padding:18px 20px; flex-shrink:0;
    border:1px solid rgba(0,0,0,0.03);
    transition:box-shadow var(--t);
  }
  .pc-banner:hover { box-shadow:var(--card-shadow-hover); }
  .pcb-top {
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:14px;
  }
  .pcb-names {
    font-size:1.05rem; font-weight:750; color:var(--g900);
    line-height:1.25; letter-spacing:-0.2px;
  }
  .pcb-tag {
    font-size:0.62rem; font-weight:700; color:var(--g400);
    text-transform:uppercase; letter-spacing:0.8px; margin-top:3px;
  }
  .fast-edit-btn {
    display:inline-flex; align-items:center; gap:5px;
    padding:6px 11px; border-radius:var(--r-md);
    background:#fff7ed; border:1.5px solid #fed7aa;
    font-size:0.75rem; font-weight:650; color:#c2410c;
    transition:all var(--t); white-space:nowrap; flex-shrink:0;
  }
  .fast-edit-btn:hover { background:#ffedd5; border-color:#fb923c; }
  .pcb-rows { display:flex; flex-direction:column; gap:0; }
  .pcb-row {
    display:flex; align-items:center; gap:10px;
    padding:5px 0; border-bottom:1px solid var(--g100);
  }
  .pcb-row:last-child { border-bottom:none; }
  .pcb-ico { font-size:0.82rem; width:16px; text-align:center; flex-shrink:0; }
  .pcb-val {
    font-size:0.8rem; color:var(--g700); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ══════════════════════════════════════ ACCORDION SECTIONS */
  .sc {
    background:var(--w); border-radius:18px;
    box-shadow:var(--card-shadow); margin-bottom:16px;
    overflow:hidden; transition:all var(--t);
    border:1px solid rgba(0,0,0,0.04);
  }
  .sc:hover { box-shadow:var(--card-shadow-hover); }
  .sc-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; cursor:pointer; user-select:none;
    transition:background var(--t);
  }
  .sc-head:hover { background:var(--g100); }
  .sc.open .sc-head { background:var(--g50); border-bottom:1px solid var(--g100); }
  .sc-left { display:flex; align-items:center; gap:10px; }
  .sc-title    { font-size:1.05rem; font-weight:720; color:var(--g900); letter-spacing:-0.2px; }
  .sc-chev { color:var(--g300); transition:transform 0.22s cubic-bezier(0.4,0,0.2,1); flex-shrink:0; }
  .sc.open .sc-chev { transform:rotate(180deg); color:var(--rose); }
  .sc-body { max-height:0; overflow:hidden; transition:max-height 0.32s cubic-bezier(0.4,0,0.2,1); }
  .sc.open .sc-body { max-height:1600px; }
  .sc-inner { padding:18px 22px; }

  /* ══════════════════════════════════════ FORM CONTROLS */
  .fg { margin-bottom:12px; }
  .fg:last-child { margin-bottom:0; }
  .fl { display:block; font-size:0.63rem; font-weight:700; color:var(--g400); margin-bottom:5px; letter-spacing:0.5px; text-transform:uppercase; }
  .fi, .ft, .fs {
    width:100%; padding:8px 11px;
    border:1.5px solid var(--g200); border-radius:var(--r-md);
    background:var(--w); color:var(--g900); font-weight:500;
    font-size:0.81rem; font-family:var(--font); outline:none;
    transition:all var(--t);
  }
  .fi::placeholder,.ft::placeholder { color:var(--g300); }
  .fi:hover:not(:focus),.ft:hover:not(:focus),.fs:hover:not(:focus) { border-color:var(--g300); }
  .fi:focus,.ft:focus,.fs:focus { border-color:var(--rose); box-shadow:0 0 0 3px var(--rose-100); background:var(--w); }
  .ft { resize:vertical; min-height:68px; line-height:1.5; }
  .fr { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fr .fg { margin-bottom:0; }
  .fhint { font-size:0.62rem; color:var(--g400); margin-top:4px; line-height:1.4; font-weight:500; }
  .sub-h {
    font-size:0.61rem; font-weight:750; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--g300); margin:14px 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .sub-h::after { content:''; flex:1; height:1px; background:var(--g150); }

  /* Hindi font for Devanagari inputs */
  .fi-hi, .ft-hi { font-family:'Noto Serif Devanagari', serif; font-size:0.85rem; }

  /* Date row helpers */
  .date-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; }
  .day-badge {
    padding:8px 10px; background:var(--rose-50); border:1.5px solid var(--rose-100);
    border-radius:var(--r-md); font-size:0.72rem; font-weight:700; color:var(--rose);
    white-space:nowrap; min-width:72px; text-align:center; line-height:1.4;
  }

  /* ══════════════════════════════════════ RIGHT COLUMN — IFRAME PREVIEW */
  .right-col {
    width:60%; flex-shrink:0;
    display:flex; flex-direction:column; overflow:hidden;
    background:#e2dbd5;
    background-image:radial-gradient(circle, rgba(0,0,0,0.045) 1.2px, transparent 0);
    background-size:22px 22px;
    position:relative;
  }

  .preview-bar {
    height:var(--topbar-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--g200); flex-shrink:0; z-index:10;
  }
  .preview-lbl {
    font-size:0.65rem; font-weight:750; letter-spacing:2.2px; text-transform:uppercase;
    color:var(--g500); display:flex; align-items:center; gap:7px;
  }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--success); animation:pulseLive 2s infinite; box-shadow:0 0 0 2px rgba(16,185,129,0.2); }
  @keyframes pulseLive { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(0.75);opacity:0.5} }

  .zoom-bar {
    display:flex; align-items:center; gap:0;
    background:var(--w); border:1px solid var(--g200);
    border-radius:8px; overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .zbtn {
    width:32px; height:30px; border-radius:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--g500); font-size:1rem; font-weight:600;
    transition:background var(--t); line-height:1;
    border-right:1px solid var(--g200);
  }
  .zbtn:last-child { border-right:none; }
  .zbtn:hover { background:var(--g100); color:var(--g900); }
  .zlvl {
    font-size:0.76rem; font-weight:650; color:var(--g700);
    min-width:46px; text-align:center;
    border-right:1px solid var(--g200); height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .zfit {
    font-size:0.68rem; font-weight:750; text-transform:uppercase;
    padding:0 10px; border-radius:0; width:auto; letter-spacing:0.8px;
    color:var(--g500); height:30px; display:flex; align-items:center;
  }
  .zfit:hover { color:var(--rose); background:var(--rose-50); }

  /* The actual card1 iframe */
  .preview-vp {
    flex:1; overflow:auto;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 24px 60px;
    position:relative;
  }
  #card1-scaler-wrap {
    display: inline-block;
    position: relative;
    flex-shrink: 0;
    width: 670px; /* default 75% zoom */
    height: 570px;
    transition: width 0.2s, height 0.2s;
  }
  .card1-outer {
    position: absolute;
    top: 0;
    left: 0;
    width: 893px;
    height: 760px;
    transform-origin: top left;
    transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    display: block; line-height: 0;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 28px 80px rgba(0,0,0,0.28), 0 8px 24px rgba(0,0,0,0.12);
  }
  #card1-iframe {
    width: 100%;
    height: 100%;
    border: none; display: block;
    background: #f2aec8;
  }

  /* ══════════════════════════════════════ TOAST */
  .toast-wrap { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; background:#0f172a; color:var(--w); border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,0.15); font-size:0.8rem; font-weight:550; pointer-events:auto; opacity:0; transform:translateY(12px) scale(0.95); transition:all 0.22s cubic-bezier(0.175,0.885,0.32,1.275); white-space:nowrap; }
  .toast.show { opacity:1; transform:translateY(0) scale(1); }
  .t-ico { width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:750; flex-shrink:0; }
  .t-s .t-ico { background:var(--success); color:var(--w); }
  .t-e .t-ico { background:var(--rose); color:var(--w); }
  .t-i .t-ico { background:#2563eb; color:var(--w); }
  .t-w .t-ico { background:#ea580c; color:var(--w); }

  /* Print */
  @media print {
    .topbar,.left-col,.preview-bar,.toast-wrap { display:none !important; }
    body { overflow:visible; height:auto; background:#fff; }
    .app { height:auto; } .body { display:block; }
    .right-col { background:#fff; }
    .preview-vp { padding:0; }
    #card1-scaler-wrap { width:100% !important; height:auto !important; display:block !important; }
    .card1-outer { position:static !important; transform:none !important; box-shadow:none; border-radius:0; width:100% !important; height:auto !important; }
    #card1-iframe { width:100% !important; height:auto !important; }
  }
  </style>
</head>
<body>
<div class="app">

  <!-- ══════════════════════════════════════════ TOPBAR -->
  <header class="topbar">

    <!-- Grid / Home -->
    <button class="tb-home" onclick="window.location.href='../index.html'" title="Dashboard">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="17" y="3" width="4" height="4" rx="1"/>
        <rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="17" y="10" width="4" height="4" rx="1"/>
        <rect x="3" y="17" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/>
      </svg>
    </button>

    <!-- Logo -->
    <a href="../index.html" class="tb-logo" title="MyInvitationCard">
      <svg class="tb-logo-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 42 C60 37,54 33,49 33 C42 33,39 40,39 45 C39 54,49 61,60 69 C71 61,81 54,81 45 C81 40,78 33,71 33 C66 33,60 37,60 42Z" fill="#ef4444" opacity="0.9"/>
        <path d="M18 42 L18 78 Q18 84 24 84 L96 84 Q102 84 102 78 L102 42" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 42 L60 14 L102 42" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M18 42 L60 68" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
        <path d="M102 42 L60 68" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <span class="tb-logo-name">MyInvitationCard</span>
    </a>

    <div class="tb-sep"></div>

    <!-- Navigation Tabs -->
    <nav class="tb-tabs">
      <button class="tab-btn" id="tab-overview" onclick="window.location.href='../template-dashboard.html'" title="Overview">
        <span class="tab-ico">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </span>
        Overview
      </button>

      <button class="tab-btn active" id="tab-content" onclick="switchBuilderTab('content')" title="Edit card content">
        <span class="tab-ico">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </span>
        Content
      </button>

      <button class="tab-btn" id="tab-customize" onclick="switchBuilderTab('customize')" title="Customize appearance">
        <span class="tab-ico">

// ══════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';

const HI_MONTHS = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
const HI_DAYS   = ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];

function fmtDateHi(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T00:00:00');
    return d.getDate() + ' ' + HI_MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + HI_DAYS[d.getDay()];
  } catch(e) { return dateStr; }
}

function toast(msg, type='i') {
  const icons = { s:'✓', e:'✕', i:'ℹ', w:'!' };
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.innerHTML = `<span class="t-ico">${icons[type]||'i'}</span><span>${esc(msg)}</span>`;
  $('toast-wrap').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2800);
}

let _saveTimer;
function triggerAutosave() {
  const ss = $('save-status'); const st = $('save-txt');
  if (ss) ss.classList.add('saving');
  if (st) st.textContent = 'Saving…';
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
      if (ss) ss.classList.remove('saving');
      if (st) st.textContent = 'Saved';
    } catch(e) { if(st) st.textContent = 'Error'; }
  }, 900);
}

// ══════════════════════════════════════════════════════
//  SEND STATE TO CARD1 IFRAME
// ══════════════════════════════════════════════════════
function sendToCard1() {
  const iframe = $('card1-iframe');
  if (!iframe || !iframe.contentWindow) return;
  
  // Clone state to avoid mutating S directly
  const payload = JSON.parse(JSON.stringify(S));
  
  // Format nimantrak address for card1.html without changing card1.html
  if (payload.nimantrak) {
    const n = payload.nimantrak;
    if (n.address) {
      n.address = 'ग्राम- ' + n.address + (n.post ? ' पो0- ' + n.post : '');
      n.post = '';
    }
  }
  
  iframe.contentWindow.postMessage({ type: 'MIC_CARD_UPDATE', card: payload }, '*');
}

// ══════════════════════════════════════════════════════
//  SETFIELD — deep-path setter that triggers sync
// ══════════════════════════════════════════════════════
function setField(path, val) {
  const keys = path.split('.');
  let obj = S;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!obj[keys[i]]) obj[keys[i]] = {};
    obj = obj[keys[i]];
  }
  obj[keys[keys.length - 1]] = val;
  sendToCard1();
  triggerAutosave();
  // Refresh banner when names, dates, or bride's address change
  const bannerFields = ['bride.name','groom.name','vivah.date','bride.address','bride.post','bride.city'];
  if (bannerFields.includes(path)) updateBanner();
}

const openSecs = new Set(['vivah', 'bride', 'groom']); // default open

function renderSections() {
  const wrap = $('sections-wrap');
  if (!wrap) return;
  wrap.innerHTML = SECTIONS.map(sec => {
    const isOpen = openSecs.has(sec.id);
    return `
      <div class="sc${isOpen ? ' open' : ''}" id="sc-${sec.id}">
        <div class="sc-head" onclick="toggleSec('${sec.id}')">
          <div class="sc-left">
            <div class="sc-title">${sec.title}</div>
          </div>
          <svg class="sc-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="sc-body">
          <div class="sc-inner" id="sci-${sec.id}">${isOpen ? sec.render() : ''}</div>
        </div>
      </div>`;
  }).join('');
  bindInputs();
}

function toggleSec(id) {
  const el = document.getElementById('sc-' + id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  el.classList.toggle('open', !wasOpen);
  if (!wasOpen) {
    openSecs.add(id);
    const inner = document.getElementById('sci-' + id);
    const sec = SECTIONS.find(s => s.id === id);
    if (inner && sec && !inner.children.length) { inner.innerHTML = sec.render(); bindInputs(); }
  } else {
    openSecs.delete(id);
  }
}

function refreshSec(id) {
  const sec = SECTIONS.find(s => s.id === id);
  const el  = document.getElementById('sci-' + id);
  if (sec && el) { el.innerHTML = sec.render(); bindInputs(); }
}

function bindInputs() {
  document.querySelectorAll('[data-field]').forEach(el => {
    el.oninput = function() { setField(this.dataset.field, this.value); };
    el.onchange = function() { setField(this.dataset.field, this.value); };
  });
}

// ══════════════════════════════════════════════════════
//  ZOOM
// ══════════════════════════════════════════════════════
let currentZoom = 75;
let templateWidth = 893;
let templateHeight = 760;

function updateTemplateSize() {
  const iframe = $('card1-iframe');
  if (iframe && iframe.contentDocument) {
    const cardEl = iframe.contentDocument.querySelector('.card') || iframe.contentDocument.body.firstElementChild;
    if (cardEl) {
      templateWidth = cardEl.offsetWidth || 893;
      templateHeight = cardEl.offsetHeight || 760;
    }
  }
}

function setZoom(z) {
  z = Math.max(20, Math.min(150, z));
  currentZoom = z;
  const outer = $('card1-outer');
  const wrap = $('card1-scaler-wrap');
  const scale = z / 100;

  if (outer) {
    outer.style.width = templateWidth + 'px';
    outer.style.height = templateHeight + 'px';
    outer.style.transform = `scale(${scale})`;
  }
  if (wrap) {
    wrap.style.width = (templateWidth * scale) + 'px';
    wrap.style.height = (templateHeight * scale) + 'px';
  }

  const lbl = $('z-lvl');
  if (lbl) lbl.textContent = z + '%';
}

function autoFit() {
  const vp = $('preview-vp');
  if (!vp) return;
  updateTemplateSize();
  const availableWidth = vp.clientWidth - 48; // 24px padding on left/right
  const z = Math.floor((availableWidth / templateWidth) * 100);
  setZoom(Math.max(20, Math.min(z, 120)));
}

$('z-in').onclick  = () => setZoom(currentZoom + 5);
$('z-out').onclick = () => setZoom(currentZoom - 5);
$('z-fit').onclick = autoFit;

// Auto-fit on window resize
window.addEventListener('resize', autoFit);

function getDownloadFilename() {
  const brideFirst = (S.bride.name || '').trim().split(/\s+/)[0] || 'Card';
  const groomFirst = (S.groom.name || '').trim().split(/\s+/)[0] || 'Card';
  if (brideFirst === 'Card' && groomFirst === 'Card') return 'MyInvitationCard';
  return 'MyInvitationCard_' + brideFirst + '_संग_' + groomFirst;
}

async function getCardCanvas() {
  const iframe = $('card1-iframe');
  if (!iframe || !iframe.contentWindow) {
    toast('Card preview not ready', 'e');
    return null;
  }

  const iframeDoc = iframe.contentDocument;
  const iframeWin = iframe.contentWindow;

  // Inject html2canvas into iframe if not already loaded
  if (!iframeWin.html2canvas) {
    await new Promise((resolve, reject) => {
      const script = iframeDoc.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      script.onload = resolve;
      script.onerror = () => { toast('Failed to load capture library', 'e'); reject(new Error('html2canvas load failed')); };
      iframeDoc.head.appendChild(script);
    });
  }

  const cardEl = iframeDoc.querySelector('.card');
  if (!cardEl) {
    toast('Card element not found', 'e');
    return null;
  }

  return await iframeWin.html2canvas(cardEl, {
    scale: 3,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#f2aec8',
    logging: false
  });
}

async function downloadCard(format) {
  $('dl-wrap').classList.remove('open');
  toast('Generating ' + format.toUpperCase() + '…', 'i');

  try {
    const canvas = await getCardCanvas();
    if (!canvas) return;

    const filename = getDownloadFilename();

    if (format === 'png') {
      const link = document.createElement('a');
      link.download = filename + '.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toast('PNG downloaded!', 's');
    }
    else if (format === 'jpg') {
      // JPG needs a white/colored background since JPEG doesn't support transparency
      const jpgCanvas = document.createElement('canvas');
      jpgCanvas.width = canvas.width;
      jpgCanvas.height = canvas.height;
      const ctx = jpgCanvas.getContext('2d');
      ctx.fillStyle = '#f2aec8';
      ctx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
      ctx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = filename + '.jpg';
      link.href = jpgCanvas.toDataURL('image/jpeg', 0.95);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toast('JPG downloaded!', 's');
    }
    else if (format === 'pdf') {
      // Lazy-load jsPDF
      if (!window.jspdf) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
          script.onload = resolve;
          script.onerror = () => { toast('Failed to load PDF library', 'e'); reject(new Error('jsPDF load failed')); };
          document.head.appendChild(script);
        });
      }

      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/png');

      // Card dimensions in cm — maintain aspect ratio
      const cardWidthCm = 23.5;
      const cardHeightCm = (canvas.height / canvas.width) * cardWidthCm;
      const isLandscape = cardWidthCm > cardHeightCm;

      const pdf = new jsPDF({
        orientation: isLandscape ? 'landscape' : 'portrait',
        unit: 'cm',
        format: [isLandscape ? cardHeightCm : cardWidthCm, isLandscape ? cardWidthCm : cardHeightCm]
      });

      pdf.addImage(imgData, 'PNG', 0, 0,
        isLandscape ? cardWidthCm : cardWidthCm,
        isLandscape ? cardHeightCm : cardHeightCm
      );
      pdf.save(filename + '.pdf');
      toast('PDF downloaded!', 's');
    }
  } catch(err) {
    console.error('Download error:', err);
    toast('Download failed — try again.', 'e');
  }
}

// ══════════════════════════════════════════════════════
//  LOAD SELECTED TEMPLATE FROM PREVIEW PAGE
// ══════════════════════════════════════════════════════
let activeTemplate = null;
try {
  const selectedRaw = localStorage.getItem('selectedTemplate');
  if (selectedRaw) {
    const selected = JSON.parse(selectedRaw);
    // Check URL param or just the presence of selectedTemplate
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('templateId');

    // If template was just selected (matches URL param or exists)
    if (selected && selected.id) {
      activeTemplate = selected;

      // Clear the selectedTemplate flag so it doesn't re-trigger on refresh
      localStorage.removeItem('selectedTemplate');

      // Clear any old builder state so user starts fresh with this template
      localStorage.removeItem(STORAGE_KEY);

      // Store which template is active for reference
      localStorage.setItem('mic_active_template', JSON.stringify({
        id: selected.id,
        title: selected.title,
        slug: selected.slug,
        thumbnail: selected.thumbnail,
        event: selected.event,
        religion: selected.religion,
        style: selected.style,
        language: selected.language
      }));

      // Show confirmation toast after a short delay (DOM needs to be ready)
      setTimeout(() => {
        toast('Template loaded: ' + selected.title, 's');
      }, 800);
    }
  }
} catch(e) { /* ignore */ }

// ══════════════════════════════════════════════════════
//  RESTORE FROM LOCALSTORAGE (only if no fresh template)
// ══════════════════════════════════════════════════════
if (!activeTemplate) {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      // Deep merge
      Object.keys(parsed).forEach(k => {
        if (typeof parsed[k] === 'object' && parsed[k] !== null && typeof S[k] === 'object') {
          Object.assign(S[k], parsed[k]);
        } else if (parsed[k] !== undefined) {
          S[k] = parsed[k];
        }
      });
    }
  } catch(e) { /* ignore */ }
}
