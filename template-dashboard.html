<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyInvitationCard - Template Dashboard</title>
  <link rel="stylesheet" href="assets/css/template-dashboard.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>
<body class="groom-theme">

  <!-- MOBILE OVERLAY -->
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <i class="fa-solid fa-envelope-open-text"></i>
        <span>MyInvitationCard</span>
      </div>

      <!-- GROOM / BRIDE SWITCH -->
      <div class="theme-switch">
        <button class="theme-btn active" data-theme="groom">Groom</button>
        <button class="theme-btn" data-theme="bride">Bride</button>
      </div>

      <!-- EVENT FILTER -->
      <div class="event-menu">
        <h4>Events</h4>

        <button class="event-btn active" data-event="all">
          <i class="fa-solid fa-layer-group"></i>
          All Templates
        </button>

        <button class="event-btn" data-event="wedding">
          <i class="fa-solid fa-ring"></i>
          Wedding
        </button>

        <button class="event-btn" data-event="engagement">
          <i class="fa-solid fa-gem"></i>
          Engagement
        </button>

        <button class="event-btn" data-event="anniversary">
          <i class="fa-solid fa-heart"></i>
          Anniversary
        </button>

        <button class="event-btn" data-event="birthday">
          <i class="fa-solid fa-cake-candles"></i>
          Birthday
        </button>
      </div>
    </div>

    <!-- AUTH -->
    <div class="sidebar-bottom">
      <a href="login.html" class="auth-btn login-btn">Login</a>
      <a href="signup.html" class="auth-btn signup-btn">Sign Up</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- TOPBAR -->

    <div class="hero-section">

    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div>
          <h1>Start Building Your Card</h1>
          <p>Select your preferred design to begin. You will have the option to customize or change your selection later.</p>
        </div>
      </div>
    </header>




    <!-- CONTROLS -->

<section class="controls-bar">
  <div class="top-controls">
    <div class="search-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Search millions of templates"
        />
      </div>
    </div>

    <div class="control-actions">
      <label for="importJson" class="import-btn">
        <i class="fa-solid fa-upload"></i>
        Upload Existing Card
      </label>
      <input type="file" id="importJson" accept=".json" hidden />
    </div>
  </div>


  <div class="quick-filters">

  <!-- STATE -->
<div class="filter-select">
  <i class="fa-solid fa-location-dot"></i>

  <select id="quickState">
    <option value="">All States</option>
    <option value="andhra-pradesh">Andhra Pradesh</option>
    <option value="assam">Assam</option>
    <option value="bihar">Bihar</option>
    <option value="chhattisgarh">Chhattisgarh</option>
    <option value="delhi">Delhi</option>
    <option value="goa">Goa</option>
    <option value="gujarat">Gujarat</option>
    <option value="haryana">Haryana</option>
    <option value="himachal-pradesh">Himachal Pradesh</option>
    <option value="jharkhand">Jharkhand</option>
    <option value="karnataka">Karnataka</option>
    <option value="kerala">Kerala</option>
    <option value="madhya-pradesh">Madhya Pradesh</option>
    <option value="maharashtra">Maharashtra</option>
    <option value="odisha">Odisha</option>
    <option value="punjab">Punjab</option>
    <option value="rajasthan">Rajasthan</option>
    <option value="tamil-nadu">Tamil Nadu</option>
    <option value="telangana">Telangana</option>
    <option value="uttar-pradesh">Uttar Pradesh</option>
    <option value="uttarakhand">Uttarakhand</option>
    <option value="west-bengal">West Bengal</option>
  </select>
</div>



  <!-- RELIGION -->
  <div class="filter-select">
    <i class="fa-solid fa-place-of-worship"></i>
    <select id="quickCategory">
      <option value="all">Religion</option>
      <option value="hindu">🕉️ Hindu</option>
      <option value="muslim">☪️ Muslim</option>
      <option value="buddha">☸️ Buddha</option>
      <option value="sikh">🪯 Sikh</option>
      <option value="christian">✝️ Christian</option>
    </select>
  </div>

  <!-- STYLE -->
  <div class="filter-select">
    <i class="fa-solid fa-palette"></i>
    <select id="quickStyle">
      <option value="all">Style</option>
      <option value="simple">🪶 Simple</option>
      <option value="modern">✨ Modern</option>
      <option value="creative">🪄 Creative</option>
    </select>
  </div>

  <!-- LANGUAGE -->
  <div class="filter-select">
    <i class="fa-solid fa-earth-asia"></i>
    <select id="quickLanguage">
      <option value="all">Language</option>
      <option value="english">🇬🇧 English</option>
      <option value="hindi">🇮🇳 Hindi</option>
    </select>
  </div>
</div>

<section class="templates-section">
  <div id="templateGrid" class="template-grid"></div>
</section>


  <!-- TEMPLATE PREVIEW MODAL -->

<div id="templateModal" class="modal hidden">
  <div class="modal-content">

    <button id="closeModal" class="close-modal">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="modal-preview">
      <img id="modalImage" src="" alt="Template Preview">
    </div>

    <div class="modal-info">
      <h2 id="modalTitle"></h2>

      <p id="modalMeta"></p>

      <div class="modal-actions">
        <button id="useTemplateBtn" class="customize-btn">
          Use This Template
        </button>

        <button id="backBtn" class="back-btn">
          Back
        </button>
      </div>

      <h3 class="suggestion-heading">Suggested Templates</h3>

      <div id="suggestionGrid" class="suggestion-grid"></div>
    </div>

  </div>
</div>
<script src="assets/js/template-dashboard.js"></script>
</body>
</html>
