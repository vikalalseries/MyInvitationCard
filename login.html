<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MyInvitationCard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc, #dbeafe);
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
      color: #1f2937;
    }

    p {
      color: #6b7280;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .link {
      margin-top: 18px;
      text-align: center;
    }

    .link a {
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h1>Welcome Back</h1>
    <p>Login to continue creating invitation cards.</p>

    <form>
      <input type="email" placeholder="Email Address" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div class="link">
      <a href="signup.html">Create new account</a>
    </div>
  </div>

</body>
</html>
