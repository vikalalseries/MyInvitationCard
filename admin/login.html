<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MyInvitationCard</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("siteTheme");
        var isDark = savedTheme === "dark";
        document.documentElement.classList.add("theme-preload");
        document.documentElement.dataset.siteTheme = isDark ? "dark" : "light";
        if (isDark) {
          document.documentElement.classList.add("site-theme-dark");
        } else {
          document.documentElement.classList.remove("site-theme-dark");
        }
      } catch (e) {}
    })();
  </script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/admin-theme.js" defer></script>
</head>
<body class="login-body">
  <!-- FLOATING THEME TOGGLE -->
  <div class="floating-theme-toggle">
    <button id="themeToggleBtn" class="theme-toggle-btn-admin" title="Toggle Theme">
      <i class="fa-regular fa-moon"></i>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-wrapper" style="background: none; border: none; width: 70px; height: 70px;">
          <svg class="custom-logo" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <!-- SMALL HEART -->
            <path
              d="M60 42
                 C60 37, 54 33, 49 33
                 C42 33, 39 40, 39 45
                 C39 54, 49 61, 60 69
                 C71 61, 81 54, 81 45
                 C81 40, 78 33, 71 33
                 C66 33, 60 37, 60 42Z"
              fill="#ef4444"
            />
            <!-- ENVELOPE OUTER BORDER -->
            <path
              d="M18 42
                 L18 78
                 Q18 84 24 84
                 L96 84
                 Q102 84 102 78
                 L102 42"
              fill="none"
              stroke="var(--primary-color)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- TOP FLAP -->
            <path
              d="M18 42 L60 14 L102 42"
              fill="none"
              stroke="var(--primary-color)"
              stroke-width="6"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
            <!-- LEFT INNER LINE -->
            <path
              d="M18 42 L60 68"
              fill="none"
              stroke="var(--primary-color)"
              stroke-width="6"
              stroke-linecap="round"
            />
            <!-- RIGHT INNER LINE -->
            <path
              d="M102 42 L60 68"
              fill="none"
              stroke="var(--primary-color)"
              stroke-width="6"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h2>MyInvitationCard</h2>
        <p style="font-weight: 600; color: var(--primary-color); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; margin-top: 5px; margin-bottom: 2px;">Admin Portal</p>
        <p>Please log in using your admin credentials</p>
      </div>

      <!-- STEP 1: CREDENTIALS FORM -->
      <form id="credentialsForm" class="login-form">
        <div class="form-group-admin">
          <label for="adminUsername">Username</label>
          <div class="input-icon-wrap">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="adminUsername" placeholder="Enter username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group-admin">
          <div class="label-row">
            <label for="adminPassword">Password</label>
            <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot?</a>
          </div>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="adminPassword" class="password-input" placeholder="••••••••" required autocomplete="current-password">
            <i class="fa-regular fa-eye-slash toggle-password" data-target="adminPassword"></i>
          </div>
        </div>

        <button type="submit" class="admin-btn-primary" id="loginSubmitBtn">
          <span>Continue</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- STEP 2: OTP VERIFICATION FORM (HIDDEN BY DEFAULT) -->
      <form id="otpVerificationForm" class="login-form hidden">
        <div class="otp-instruction">
          <i class="fa-solid fa-envelope-open-text"></i>
          <p>We've sent a 6-digit verification code to your registered email.</p>
          <span class="dev-otp-indicator" id="devOtpText" style="display:none; font-size:11px; color:#10b981; margin-top:5px; font-weight:600;"></span>
        </div>

        <div class="form-group-admin">
          <label for="adminOtp">Verification Code</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-key"></i>
            <input type="text" id="adminOtp" placeholder="Enter 6-digit code" maxlength="6" required>
          </div>
        </div>

        <button type="submit" class="admin-btn-primary" id="verifyOtpBtn">
          <span>Verify & Login</span>
          <i class="fa-solid fa-circle-check"></i>
        </button>
        <button type="button" class="admin-btn-link" id="backToCredentialsBtn">Back to credentials</button>
      </form>

      <!-- PASSWORD RESET MODAL / FORM (HIDDEN BY DEFAULT) -->
      <div id="passwordResetWrapper" class="login-form hidden">
        <div class="reset-header">
          <button id="closeResetBtn" class="close-btn-admin"><i class="fa-solid fa-xmark"></i></button>
          <h3>Password Recovery</h3>
          <p id="resetSubtext">Enter your username to request security OTPs</p>
        </div>

        <!-- RESET STEP 1: USERNAME -->
        <form id="resetRequestForm">
          <div class="form-group-admin">
            <label for="resetUsername">Username</label>
            <div class="input-icon-wrap">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="resetUsername" placeholder="Enter admin username" required>
            </div>
          </div>
          <button type="submit" class="admin-btn-primary" id="sendResetOtpsBtn">Send Verification Codes</button>
        </form>

        <!-- RESET STEP 2: OTP CODES -->
        <form id="resetVerifyForm" class="hidden">
          <div class="form-group-admin">
            <label for="resetEmailOtp">Email OTP</label>
            <div class="input-icon-wrap">
              <i class="fa-regular fa-envelope"></i>
              <input type="text" id="resetEmailOtp" placeholder="Enter email code" maxlength="6" required>
            </div>
            <span class="dev-otp-indicator" id="devEmailOtpText" style="display:none; font-size:11px; color:#10b981; margin-top:2px;"></span>
          </div>

          <div class="form-group-admin">
            <label for="resetPhoneOtp">Mobile OTP</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-mobile-screen"></i>
              <input type="text" id="resetPhoneOtp" placeholder="Enter mobile code" maxlength="6" required>
            </div>
            <span class="dev-otp-indicator" id="devPhoneOtpText" style="display:none; font-size:11px; color:#10b981; margin-top:2px;"></span>
          </div>
          <button type="submit" class="admin-btn-primary" id="verifyResetOtpsBtn">Verify Codes</button>
        </form>

        <!-- RESET STEP 3: NEW PASSWORD -->
        <form id="resetCompleteForm" class="hidden">
          <div class="form-group-admin">
            <label for="newPassword">New Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="newPassword" class="password-input" placeholder="••••••••" required>
              <i class="fa-regular fa-eye-slash toggle-password" data-target="newPassword"></i>
            </div>
          </div>

          <div class="form-group-admin">
            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="confirmNewPassword" class="password-input" placeholder="••••••••" required>
              <i class="fa-regular fa-eye-slash toggle-password" data-target="confirmNewPassword"></i>
            </div>
          </div>
          <button type="submit" class="admin-btn-primary" id="completeResetBtn">Reset Password</button>
        </form>
      </div>

    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="toast-container-admin"></div>

  <!-- SCRIPTS -->
  <script src="js/admin-login.js"></script>
</body>
</html>
