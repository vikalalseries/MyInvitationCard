<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Builder — MyInvitationCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<div class="app">
  
  <!-- ══════════════════════════════════════ TOPBAR NAVBAR -->
  <header class="topbar">
    <!-- Back to Dashboard Home -->
    <a href="../template-dashboard.html" class="tb-home" title="Back to Dashboard"><i class="fa-solid fa-house"></i></a>
    
    <!-- Site Logo -->
    <a href="javascript:void(0)" onclick="window.location.reload()" class="tb-logo" title="MyInvitationCard">
      <svg class="tb-logo-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 42 C60 37,54 33,49 33 C42 33,39 40,39 45 C39 54,49 61,60 69 C71 61,81 54,81 45 C81 40,78 33,71 33 C66 33,60 37,60 42Z" fill="#ef4444" opacity="0.9"/>
        <path d="M18 42 L18 78 Q18 84 24 84 L96 84 Q102 84 102 78 L102 42" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 42 L60 14 L102 42" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 42 L60 68" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
        <path d="M102 42 L60 68" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <span class="tb-logo-name">MyInvitationCard</span>
    </a>
    
    <div class="tb-sep"></div>
    
    <!-- Editable Document Title -->
    <div class="doc-title-wrap">
      <input type="text" id="doc-title-input" class="doc-title-input" value="Wedding Card 1" title="Click to rename draft">
    </div>
    
    <div class="tb-sep"></div>

    <!-- Navigation Tabs (Center segment) -->
    <nav class="tb-tabs">
      <button class="tab-btn active" id="btn-content-tab" onclick="switchTab('content-tab')" title="Edit card text details">
        <span class="tab-ico"><i class="fa-solid fa-pen-to-square"></i></span>Content
      </button>
      <button class="tab-btn" id="btn-ceremonies-tab" onclick="switchTab('ceremonies-tab')" title="Configure ceremony programs">
        <span class="tab-ico"><i class="fa-solid fa-calendar-days"></i></span>Ceremonies
      </button>
      <button class="tab-btn" id="btn-styles-tab" onclick="switchTab('styles-tab')" title="Customize background themes & colors">
        <span class="tab-ico"><i class="fa-solid fa-palette"></i></span>Styles
      </button>
    </nav>

    <!-- Toolbar Right (Saves, Downloads, Profile Actions) -->
    <div class="tb-right">
      <!-- Blinking Save Status -->
      <div class="save-status" id="save-status">
        <span class="save-dot"></span>
        <span id="save-status-text">Draft Saved</span>
      </div>
      
      <div class="tb-sep"></div>

      <!-- Print Action -->
      <button class="print-btn" onclick="printCard()" title="Open print preview settings"><i class="fa-solid fa-print"></i>Print</button>

      <!-- Download Button Dropdown -->
      <div class="dl-wrap" id="dl-wrap">
        <button class="dl-btn" id="dl-btn-toggle" onclick="toggleDownloadMenu(event)" title="Download invitation in high resolution formats">
          <i class="fa-solid fa-download"></i>Download <i class="fa-solid fa-chevron-down dl-chev" style="font-size:10px; margin-left:2px;"></i>
        </button>
        <div class="dl-menu" id="dl-menu" onclick="event.stopPropagation()">
          <button class="dl-item" id="dl-pdf" onclick="handleDownload('pdf')"><i class="fa-regular fa-file-pdf" style="color:var(--rose);"></i>Download PDF</button>
          <button class="dl-item" id="dl-png" onclick="handleDownload('png')"><i class="fa-regular fa-image"></i>Download PNG</button>
          <button class="dl-item" id="dl-jpg" onclick="handleDownload('jpg')"><i class="fa-regular fa-image"></i>Download JPG</button>
          <div class="dl-sep" id="dl-menu-sep"></div>
          <button class="dl-login-btn" id="dl-login-gate-btn" onclick="showLoginPopup()">Login to Download</button>
        </div>
      </div>
      
      <div class="tb-sep"></div>

      <!-- Authentication Action Button -->
      <button class="print-btn" id="auth-action-btn" onclick="handleAuthAction()" style="border-color:var(--g300); font-weight:700;">
        <i class="fa-solid fa-user"></i>&nbsp;<span id="auth-action-text">Login</span>
      </button>
    </div>
  </header>
  
  <!-- ══════════════════════════════════════ BODY SECTION -->
  <main class="body">
    
    <!-- Sidebar form controls (Width: 440px) -->
    <div class="sidebar">
      
      <!-- Hidden template selector placeholder (for loading templates dynamically in JS) -->
      <select id="template-select" style="display:none;" onchange="loadTemplate(this.value)">
        <option value="card1" selected>Traditional Hindu Wedding Card 1</option>
      </select>

      <div class="forms-container">
        
        <!-- Content Pane -->
        <div class="tab-pane active" id="content-tab">
          <div id="dynamic-content-fields" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Rendered dynamically as collapsible accordion panels (.sc) -->
          </div>
        </div>
        
        <!-- Ceremonies Pane -->
        <div class="tab-pane" id="ceremonies-tab">
          <div id="dynamic-ceremonies-fields" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Rendered dynamically as collapsible ceremony panels -->
          </div>
        </div>
        
        <!-- Styles Pane -->
        <div class="tab-pane" id="styles-tab">
          <div id="dynamic-styles-fields" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Rendered dynamically as collapsible style controls -->
          </div>
        </div>
        
      </div>
      
      <!-- Footer settings -->
      <div class="sidebar-footer">
        <button class="footer-btn btn-secondary" onclick="resetToDefaults()" title="Restore template text & visual themes to default settings">
          <i class="fa-solid fa-rotate-left"></i>Reset Defaults
        </button>
        <button class="footer-btn btn-primary" onclick="exportData()" title="Save edits data offline in JSON format">
          <i class="fa-solid fa-file-code"></i>Backup Draft
        </button>
      </div>
      
    </div>
    
    <!-- Live Preview Workspace -->
    <div class="workspace">
      <iframe class="preview-frame" id="preview-iframe" src="preview/preview.html?template=card1"></iframe>
    </div>

  </main>

</div>

<!-- Toast notifications wrapper -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- ══════════════════════════════════════════ AUTH MODAL DIALOGS -->
<div class="login-overlay" id="login-overlay" onclick="hideLoginPopup(event)"></div>
<div class="login-popup" id="login-popup" onclick="event.stopPropagation()">
  <button class="lp-close" onclick="hideLoginPopup(event)" title="Close dialog"><i class="fa-solid fa-xmark"></i></button>
  
  <!-- View 1: Welcome Options -->
  <div id="lp-view-welcome" class="lp-view active">
    <div class="lp-title">Login</div>
    <button class="lp-google-btn" onclick="simulateLogin('Google User')">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continue with Google
    </button>
    <button class="lp-signin-btn" onclick="switchPopupView('lp-view-signin')">
      <i class="fa-regular fa-envelope"></i>
      Login with Email
    </button>
    <div class="lp-create-link">
      Don't have an account? <span onclick="switchPopupView('lp-view-signup')">Sign up</span>
    </div>
  </div>

  <!-- View 2: Sign In -->
  <div id="lp-view-signin" class="lp-view">
    <div class="lp-title">Login</div>
    <form class="lp-form" onsubmit="event.preventDefault(); simulateLogin(document.getElementById('lp-login-email').value)">
      <input type="email" id="lp-login-email" class="lp-input" placeholder="Email Address" required>
      <input type="password" id="lp-login-password" class="lp-input" placeholder="Password" required>
      <button type="submit" class="lp-action-btn">Login</button>
    </form>
    <div class="lp-switch-link">
      <span onclick="switchPopupView('lp-view-welcome')">Back</span>
    </div>
  </div>

  <!-- View 3: Sign Up -->
  <div id="lp-view-signup" class="lp-view">
    <div class="lp-title">Sign Up</div>
    <form class="lp-form" onsubmit="event.preventDefault(); switchPopupView('lp-view-otp')">
      <input type="text" id="lp-signup-name" class="lp-input" placeholder="Full Name" required>
      <input type="email" id="lp-signup-email" class="lp-input" placeholder="Email Address" required>
      <input type="password" id="lp-signup-password" class="lp-input" placeholder="Password" required>
      <input type="password" id="lp-signup-confirm" class="lp-input" placeholder="Confirm Password" required>
      <button type="submit" class="lp-action-btn">Create Account</button>
    </form>
    <div class="lp-switch-link">
      Already have an account? <span onclick="switchPopupView('lp-view-signin')">Login</span> | <span onclick="switchPopupView('lp-view-welcome')">Back</span>
    </div>
  </div>

  <!-- View 4: OTP verification code -->
  <div id="lp-view-otp" class="lp-view">
    <div class="lp-title">Verify Code</div>
    <p class="lp-otp-text">Enter the 6-digit verification code sent to your email.</p>
    <form class="lp-form" onsubmit="event.preventDefault(); simulateLogin(document.getElementById('lp-signup-email').value || 'Registered User')">
      <input type="text" class="lp-input" placeholder="Enter 6-digit code" maxlength="6" pattern="\d{6}" required style="text-align:center; font-size:20px; letter-spacing:8px;">
      <button type="submit" class="lp-action-btn">Verify Code</button>
    </form>
    <div class="lp-resend-section">
      <span>Didn't receive code?</span>
      <button class="lp-resend-btn" onclick="toast('OTP re-sent successfully!', 'i')" type="button">Resend OTP</button>
    </div>
    <div class="lp-switch-link">
      <span onclick="switchPopupView('lp-view-signup')">Back</span>
    </div>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
